<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Positions</title>
<style>
:root{
  --paper:#faf6ef; --card:#fffdf9;
  --ink:#1b1713; --ink-2:#4a423a; --ink-3:#8a7f72;
  --rule:#e0d7c8;
  --accent:#b4541e; --accent-2:#8f4116;
  --red:#9b2c2c; --red-soft:#f8e6e4;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#16120e; --card:#1b1611;
    --ink:#f0e8dc; --ink-2:#c2b6a5; --ink-3:#8b7f6f;
    --rule:#332a21;
    --accent:#e08a4f; --accent-2:#f0a26b;
    --red:#e08a82; --red-soft:#2a1614;
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:1.5rem}
.sheet{width:100%;max-width:23rem}
.wordmark{font-family:var(--serif);font-size:2.1rem;line-height:1;font-weight:700;
  letter-spacing:-.02em;margin:0 0 .35rem}
.wordmark em{font-style:italic;color:var(--accent);font-weight:400}
.tagline{font-family:var(--serif);font-style:italic;color:var(--ink-3);
  font-size:.98rem;margin:0 0 1.6rem;padding-bottom:1.4rem;
  border-bottom:2px solid var(--ink)}
.label{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:.3rem}
.row{margin-bottom:1.3rem}
input{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;
  color:var(--ink);font-family:var(--serif);font-size:1.15rem;padding:.35rem 0;
  outline:none;transition:border-color .18s}
input:focus{border-bottom-color:var(--accent)}
button{width:100%;font-family:var(--sans);font-size:.76rem;letter-spacing:.13em;
  text-transform:uppercase;font-weight:650;cursor:pointer;
  background:var(--accent);border:1px solid var(--accent);color:#fff;
  padding:.72rem 1rem;border-radius:2px;transition:.16s;margin-top:.4rem}
button:hover{background:var(--accent-2);border-color:var(--accent-2)}
button:disabled{opacity:.45;cursor:wait}
.err{border-left:2px solid var(--red);background:var(--red-soft);color:var(--red);
  padding:.6rem .85rem;font-size:.85rem;margin-bottom:1.2rem}
.foot{margin-top:1.8rem;padding-top:1rem;border-top:1px solid var(--rule);
  font-size:.78rem;color:var(--ink-3);font-family:var(--serif);font-style:italic}
</style>
</head>
<body>

<div class="sheet">
  <h1 class="wordmark">Positions<em>.</em></h1>
  <p class="tagline">Academic vacancies, gathered and searchable.</p>

  <div id="error"></div>

  <form id="form" autocomplete="on">
    <div class="row">
      <label class="label" for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="row">
      <label class="label" for="p">Password</label>
      <input id="p" name="password" type="password"
             autocomplete="current-password" required>
    </div>
    <button id="go" type="submit">Sign in</button>
  </form>

  <p class="foot">Accounts are issued by hand. There is nothing to register.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('#form').onsubmit = async event => {
  event.preventDefault();
  $('#go').disabled = true;
  $('#error').innerHTML = '';

  try {
    const response = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: $('#u').value.trim(), password: $('#p').value}),
    });
    const data = await response.json();

    if (!response.ok) {
      $('#error').innerHTML = `<div class="err">${esc(data.error || 'Sign-in failed.')}</div>`;
      $('#p').value = '';
      $('#p').focus();
      return;
    }
    // The cookie is set by the response; from here the search page will load.
    location.href = '/';
  } catch (error) {
    $('#error').innerHTML = `<div class="err">${esc(error.message)}</div>`;
  } finally {
    $('#go').disabled = false;
  }
};
</script>
</body>
</html>
