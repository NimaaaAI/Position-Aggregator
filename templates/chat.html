<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positions</title>
<style>
:root{
  --paper:#faf6ef; --paper-2:#f3ede2; --card:#fffdf9;
  --ink:#1b1713; --ink-2:#4a423a; --ink-3:#8a7f72;
  --rule:#e0d7c8; --rule-2:#eee7db;
  --accent:#b4541e; --accent-2:#8f4116; --accent-soft:#f7e9dd;
  --gold:#8a6d1f; --gold-soft:#f7efd8;
  --red:#9b2c2c; --red-soft:#f8e6e4;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#16120e; --paper-2:#1d1813; --card:#1b1611;
    --ink:#f0e8dc; --ink-2:#c2b6a5; --ink-3:#8b7f6f;
    --rule:#332a21; --rule-2:#261f18;
    --accent:#e08a4f; --accent-2:#f0a26b; --accent-soft:#2c1f14;
    --gold:#d5b45c; --gold-soft:#251f10;
    --red:#e08a82; --red-soft:#2a1614;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;font-feature-settings:"kern","liga"}
a{color:inherit}
::selection{background:var(--accent-soft);color:var(--ink)}
.serif{font-family:var(--serif)}
.label{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}

/* ---------- masthead ---------- */
.masthead{border-bottom:2px solid var(--ink);background:var(--paper)}
.mast-in{max-width:80rem;margin:0 auto;padding:1.5rem 1.6rem .9rem;
  display:flex;align-items:flex-end;gap:1.2rem;flex-wrap:wrap}
.wordmark{font-family:var(--serif);font-size:2rem;line-height:1;font-weight:700;
  letter-spacing:-.02em;margin:0}
.wordmark em{font-style:italic;color:var(--accent);font-weight:400}
.masthead .dbstat{margin-left:auto;display:flex;gap:1.4rem;flex-wrap:wrap;
  padding-bottom:.2rem}
.whoami{display:flex;gap:1.1rem;align-items:baseline;padding-bottom:.2rem;
  border-left:1px solid var(--rule);padding-left:1.4rem}
.whoami a,.whoami span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:650;text-decoration:none;color:var(--ink-3);
  border-bottom:1px solid transparent;padding-bottom:2px}
.whoami a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.whoami .name{color:var(--ink)}
@media (max-width:52rem){.whoami{border-left:0;padding-left:0}}
.stat{font-size:.74rem;color:var(--ink-3);letter-spacing:.04em}
.stat b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--ink);
  font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- search ---------- */
.hero{max-width:80rem;margin:0 auto;padding:2rem 1.6rem 0}
.askline{display:flex;align-items:baseline;gap:.9rem;border-bottom:2px solid var(--ink);
  padding-bottom:.35rem;transition:border-color .2s}
.askline:focus-within{border-color:var(--accent)}
#q{flex:1;min-width:6rem;border:0;background:transparent;color:var(--ink);outline:none;
  font-family:var(--serif);font-size:1.5rem;line-height:1.35;padding:.15rem 0}
#q::placeholder{color:var(--ink-3);font-style:italic}
.btn{font:inherit;font-family:var(--sans);font-size:.76rem;letter-spacing:.13em;
  text-transform:uppercase;font-weight:650;cursor:pointer;white-space:nowrap;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:.5rem 1rem;border-radius:2px;transition:.16s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btn.primary:disabled:hover{background:var(--accent);color:#fff}

/* ---------- filters ---------- */
.filters{max-width:80rem;margin:0 auto;padding:.9rem 1.6rem 0;display:flex;
  gap:.35rem 1.5rem;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--ink-2);
  padding:.2rem 0;border-bottom:1px solid transparent;transition:.16s}
.field select,.field input{font:inherit;font-size:.78rem;border:0;background:transparent;
  color:var(--ink);outline:none;padding:0;font-weight:600;cursor:pointer}
.field input[type=number]{width:2.8rem;text-align:right;
  font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--rule);cursor:text}
.field input[type=checkbox]{accent-color:var(--accent);width:.85rem;height:.85rem}
.field label{cursor:pointer;user-select:none}
.field.on{color:var(--accent);border-bottom-color:var(--accent)}
.field.on select,.field.on input{color:var(--accent)}
.chips{max-width:80rem;margin:0 auto;padding:1.1rem 1.6rem 0;display:flex;
  gap:.4rem .8rem;flex-wrap:wrap;align-items:baseline}
.chips .label{margin-right:.3rem}
.chip{font-family:var(--serif);font-size:.92rem;font-style:italic;color:var(--ink-2);
  background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer;
  padding:0 0 1px;transition:.16s}
.chip:hover{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- layout ---------- */
main{max-width:80rem;margin:0 auto;padding:2rem 1.6rem 5rem;display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:0 3rem;align-items:start}
@media (max-width:68rem){main{grid-template-columns:1fr;gap:2.5rem}}
.col+.col{border-left:1px solid var(--rule);padding-left:3rem;margin-left:-1.5rem}
@media (max-width:68rem){.col+.col{border-left:0;padding-left:0;margin-left:0;
  border-top:2px solid var(--ink);padding-top:1.5rem}}
.col-head{display:flex;align-items:baseline;gap:.8rem;padding-bottom:.5rem;
  border-bottom:1px solid var(--ink);margin-bottom:1.3rem}
.col-head .right{margin-left:auto;font-size:.74rem;color:var(--ink-3);
  font-variant-numeric:tabular-nums;letter-spacing:.03em}
.sticky{position:sticky;top:1.5rem}
@media (max-width:68rem){.sticky{position:static}}

/* ---------- answer ---------- */
#answer{white-space:pre-wrap;word-wrap:break-word;font-family:var(--serif);
  font-size:1.02rem;line-height:1.72;color:var(--ink)}
#answer .head{display:block;margin:1.5rem 0 .5rem;font-family:var(--sans);
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700}
#answer .head:first-child{margin-top:0}
#answer .cite{display:inline-block;text-decoration:none;font-family:var(--sans);
  font-size:.7rem;font-weight:700;color:#fff;background:var(--accent);
  border-radius:2px;padding:.05rem .32rem;line-height:1.5;vertical-align:.08em;
  transition:.16s}
#answer .cite:hover{background:var(--ink)}
.placeholder{color:var(--ink-3);font-family:var(--serif);font-style:italic;
  font-size:1rem}
.stats{display:flex;gap:1.6rem;flex-wrap:wrap;font-size:.72rem;color:var(--ink-3);
  border-top:1px solid var(--rule);margin-top:1.6rem;padding-top:.8rem;
  font-variant-numeric:tabular-nums;letter-spacing:.03em}
.stats b{color:var(--ink);font-weight:650}
.warn{border-left:2px solid var(--gold);background:var(--gold-soft);color:var(--gold);
  padding:.65rem .9rem;font-size:.82rem;margin-top:1.1rem;font-family:var(--sans)}
.err{border-left:2px solid var(--red);background:var(--red-soft);color:var(--red);
  padding:.65rem .9rem;font-size:.86rem;font-family:var(--sans)}

/* ---------- results ---------- */
.pos{display:grid;grid-template-columns:2.1rem 1fr;gap:.9rem;padding:1.1rem 0;
  border-bottom:1px solid var(--rule-2)}
.pos:last-child{border-bottom:0}
.pos.given{background:linear-gradient(90deg,var(--accent-soft) 0,transparent 92%);
  box-shadow:-1.6rem 0 0 var(--accent-soft),1rem 0 0 transparent}
.rank{font-family:var(--serif);font-size:1.05rem;font-weight:700;color:var(--ink-3);
  text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
.pos.given .rank{color:var(--accent)}
.ptitle{font-family:var(--serif);font-size:1.08rem;font-weight:700;line-height:1.35;
  text-decoration:none;letter-spacing:-.01em;display:inline-block}
.ptitle:hover{color:var(--accent)}
.byline{font-size:.8rem;color:var(--ink-2);margin-top:.22rem}
.byline .where{color:var(--ink-3)}
.snippet{font-family:var(--serif);font-size:.9rem;color:var(--ink-2);margin-top:.42rem;
  line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:.85rem;flex-wrap:wrap;align-items:center;margin-top:.5rem;
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:650}
.tag-src{color:var(--accent)}
.tag-closed{color:var(--red)}
.tag-soon{color:var(--gold)}
.tag-alt{color:var(--ink-3);text-decoration:none;border-bottom:1px dotted var(--ink-3)}
.tag-alt:hover{color:var(--accent);border-bottom-color:var(--accent)}
.scores{display:flex;align-items:center;gap:.8rem;margin-top:.5rem;flex-wrap:wrap;
  font-size:.68rem;color:var(--ink-3);font-variant-numeric:tabular-nums;
  letter-spacing:.04em}
.bar{width:3.2rem;height:2px;background:var(--rule);flex:none}
.bar i{display:block;height:100%;background:var(--accent)}
.sc b{color:var(--ink-2);font-weight:650}
.sc.miss{opacity:.4}

/* ---------- states ---------- */
.empty{padding:3rem 0;text-align:center;color:var(--ink-3);font-family:var(--serif);
  font-style:italic;font-size:1rem}
.skel{padding:1.1rem 0;border-bottom:1px solid var(--rule-2)}
.skel div{height:.6rem;background:linear-gradient(90deg,var(--rule-2) 25%,
  var(--rule) 37%,var(--rule-2) 63%);background-size:400% 100%;
  animation:sh 1.4s ease-in-out infinite}
.skel div+div{margin-top:.55rem}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{display:inline-block;width:.75rem;height:.75rem;border:1.5px solid var(--rule);
  border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
  vertical-align:-.05rem;margin-right:.5rem}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- phones ---------- */
/* The masthead reflows into two rows -- name and account first, the database
   counts underneath -- because three groups on one line at 390px leaves each of
   them a few characters wide. */
@media (max-width:40rem){
  .mast-in{padding:.9rem 1.1rem .7rem;gap:.55rem}
  .wordmark{font-size:1.5rem;order:1}
  .whoami{order:2;margin-left:auto;border-left:0;padding-left:0;gap:.85rem}
  .masthead .dbstat{order:3;width:100%;margin-left:0;gap:1.2rem}
  .stat b{font-size:1rem;display:inline;margin-right:.25rem}

  /* The two buttons drop below the question rather than squeezing beside it,
     and share the width between them. */
  .hero{padding:1.3rem 1.1rem 0}
  .askline{flex-wrap:wrap;gap:.55rem;border-bottom:0;padding-bottom:0}
  #q{flex-basis:100%;min-width:0;font-size:1.2rem;padding-bottom:.35rem;
     border-bottom:2px solid var(--ink)}
  #q:focus{border-bottom-color:var(--accent)}
  .btn{flex:1;text-align:center;padding:.6rem .5rem}

  .filters{padding:.85rem 1.1rem 0;gap:.35rem 1.1rem}
  .chips{padding:1rem 1.1rem 0}
  main{padding:1.5rem 1.1rem 3.5rem}
  .col-head{margin-bottom:1rem}

  .pos{grid-template-columns:1.4rem 1fr;gap:.65rem;padding:1rem 0}
  .pos.given{box-shadow:-1.1rem 0 0 var(--accent-soft),1rem 0 0 transparent}
  .rank{font-size:.95rem}
  .ptitle{font-size:1.02rem}
  #answer{font-size:1rem}
  .stats{gap:.5rem 1.1rem}
  .scores{gap:.5rem .7rem}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-in">
    <h1 class="wordmark">Positions<em>.</em></h1>
    <div class="dbstat" id="dbstat"></div>
    <nav class="whoami" id="whoami"></nav>
  </div>
</header>

<div class="hero">
  <div class="askline">
    <input id="q" placeholder="What are you looking for?" autocomplete="off">
    <button id="find" class="btn">Search</button>
    <button id="ask" class="btn primary">Ask</button>
  </div>
</div>

<div class="filters">
  <div class="field" id="f-type">
    <select id="ptype" title="Applied before ranking, not after: PhD positions then compete only with other PhD positions.">
      <option value="">Any post</option>
      <option value="phd">PhD only</option>
      <option value="postdoc">Postdoc only</option>
      <option value="professor">Professor only</option>
      <option value="lecturer">Lecturer only</option>
      <option value="researcher">Researcher only</option>
      <option value="engineer">Engineer only</option>
    </select>
  </div>
  <div class="field" id="f-country">
    <select id="country" title="Matched on an ISO country code, not on the spelling — the boards write the same country three different ways.">
      <option value="">Anywhere</option>
    </select>
  </div>
  <div class="field" id="f-open">
    <input type="checkbox" id="openonly" checked><label for="openonly">Open only</label>
  </div>
  <div class="field" id="f-hybrid">
    <input type="checkbox" id="hybrid" checked>
    <label for="hybrid" title="Vector search plus Postgres full-text, fused by rank. Untick for vector only — try it on an acronym like MSCA or ERC Starting Grant.">Hybrid</label>
  </div>
  <div class="field" id="f-dedupe">
    <input type="checkbox" id="dedupe" checked>
    <label for="dedupe" title="Several boards carry the same job. Ticked, one row is shown and the others appear as 'also on'. Untick to see every copy.">Merge copies</label>
  </div>
  <div class="field">Retrieve <input id="show" type="number" value="60" min="1" max="500"></div>
  <div class="field">To model <input id="ctx" type="number" value="10" min="0" max="60"></div>
  <div class="field"><select id="model"></select></div>
</div>

<div class="chips" id="chips"><span class="label">Try</span></div>

<main>
  <section class="col">
    <div class="col-head"><span class="label">The answer</span>
      <span class="right" id="answer-right"></span></div>
    <div id="answer" class="placeholder">Ask a question in plain language — or set
      the filters, leave the box empty and press Search to browse everything that
      matches.</div>
    <div id="miss"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="col sticky">
    <div class="col-head"><span class="label">Retrieved</span>
      <span class="right" id="poshead"></span></div>
    <div id="positions"><div class="empty">Nothing searched yet.</div></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const EXAMPLES = [
  'funded PhD in machine learning',
  'ERC Starting Grant',
  'doktorand maskininlärning',
  'PhD in computer vision in Italy',
  'MSCA doctoral network',
];

$('#chips').insertAdjacentHTML('beforeend', EXAMPLES.map(e =>
  `<button class="chip">${esc(e)}</button>`).join(''));
$('#chips').onclick = e => {
  if (!e.target.classList.contains('chip')) return;
  $('#q').value = e.target.textContent;
  run('/api/chat');
};

function payload() {
  return {
    question: $('#q').value.trim(),
    model: $('#model').value,
    show: +$('#show').value || 60,
    context: +$('#ctx').value || 10,
    open_only: $('#openonly').checked,
    hybrid: $('#hybrid').checked,
    dedupe: $('#dedupe').checked,
    position_type: $('#ptype').value || null,
    country: $('#country').value || null,
    rerank: true,
  };
}

// Light up a filter when it is doing something, so a forgotten setting is visible
// rather than silently changing every result.
function paintFilters() {
  $('#f-type').classList.toggle('on', !!$('#ptype').value);
  $('#f-country').classList.toggle('on', !!$('#country').value);
  $('#f-open').classList.toggle('on', $('#openonly').checked);
  $('#f-hybrid').classList.toggle('on', !$('#hybrid').checked);
  $('#f-dedupe').classList.toggle('on', !$('#dedupe').checked);
}
// Changing a filter with an empty question box can only mean "show me what is
// there now", so it browses immediately rather than waiting to be asked twice.
// With a question typed it does not, because that would throw the question away.
function filterChanged() {
  paintFilters();
  if (!$('#q').value.trim()) browse(false);
}

for (const id of ['#ptype', '#country', '#openonly', '#dedupe'])
  $(id).onchange = filterChanged;
$('#hybrid').onchange = paintFilters;   // only affects ranking, nothing to rebrowse
paintFilters();

// A missing score means that search did not return this position at all, which is
// worth seeing: it shows where one search found something another missed.
function score(label, value) {
  if (value === null || value === undefined)
    return `<span class="sc miss">${label} —</span>`;
  return `<span class="sc">${label} <b>${value}</b></span>`;
}

function deadline(p) {
  if (p.closed) return '<span class="tag-closed">closed</span>';
  if (!p.closes) return '';
  const days = Math.ceil((new Date(p.closes) - Date.now()) / 86400000);
  if (days >= 0 && days <= 14)
    return `<span class="tag-soon">${days === 0 ? 'closes today' : days + ' days left'}</span>`;
  return '';
}

function showPositions(positions, given) {
  $('#poshead').textContent = given
    ? `${positions.length} found · top ${given} to the model`
    : `${positions.length} found`;

  if (!positions.length) {
    $('#positions').innerHTML = '<div class="empty">No positions matched.</div>';
    return;
  }

  $('#positions').innerHTML = positions.map((p, i) => `
    <article class="pos ${i < given ? 'given' : ''}">
      <div class="rank">${i + 1}</div>
      <div>
        <a class="ptitle" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <div class="byline">${esc(p.employer || '')}${
          p.city ? `<span class="where"> · ${esc(p.city)}${
            p.country ? ', ' + esc(p.country) : ''}</span>` : ''}${
          p.closes ? `<span class="where"> · closes ${esc(p.closes)}</span>` : ''}</div>
        ${p.snippet ? `<div class="snippet">${esc(p.snippet)}</div>` : ''}
        <div class="tags">
          ${p.source ? `<span class="tag-src">${esc(p.source)}</span>` : ''}
          ${deadline(p)}
          ${(p.also_on || []).map(c => `<a class="tag-alt" href="${esc(c.url)}"
             target="_blank" rel="noopener">also on ${esc(c.source)}</a>`).join('')}
        </div>
        <div class="scores">
          ${p.rerank_score !== null && p.rerank_score !== undefined
            ? `<span class="bar"><i style="width:${Math.round(p.rerank_score * 100)}%"></i></span>
               <span class="sc">rerank <b>${p.rerank_score}</b></span>` : ''}
          ${score('vector', p.vector_score)}${score('chunk', p.chunk_score)}${score('text', p.text_score)}
        </div>
      </div>
    </article>`).join('');
}

// The model writes markdown and cites positions as [3]. Turn both into HTML, and
// make each citation a link to that position — the href comes from the database
// row, never from the model, so it cannot be mistyped.
function render(text, positions) {
  let html = esc(text);
  html = html.replace(/^\s*#{1,6}\s*(.+)$/gm, '<b class="head">$1</b>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>');
  html = html.replace(/\[(\d+)\]/g, (whole, number) => {
    const p = positions[+number - 1];
    if (!p) return whole;
    return `<a class="cite" href="${esc(p.url)}" target="_blank" rel="noopener"
             title="${esc(p.title)}">${number}</a>`;
  });
  return html;
}

// No question, but filters set: show everything that matches instead of nothing.
// Straight from the table -- no embedding, no reranking, no model.
let browsing = null;

async function browse(more) {
  const body = payload();
  browsing = more ? {...browsing, offset: browsing.offset + browsing.limit}
                  : {limit: 100, offset: 0, open_only: body.open_only,
                     dedupe: body.dedupe, position_type: body.position_type,
                     country: body.country};

  if (!more) {
    $('#answer').innerHTML = '<div class="placeholder">Browsing — nothing was ranked '
      + 'and no model was called. Type a question to search instead.</div>';
    $('#miss').innerHTML = '';
    $('#positions').innerHTML = Array.from({length: 5}, () =>
      '<div class="skel"><div style="width:72%"></div><div style="width:44%"></div></div>').join('');
  }

  const response = await fetch('/api/browse', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(browsing),
  });
  const data = await response.json();
  if (data.error) {
    $('#answer').innerHTML = `<div class="err">${esc(data.error)}</div>`;
    return;
  }

  shown = more ? shown.concat(data.positions) : data.positions;
  showPositions(shown, 0);
  $('#poshead').textContent =
    `${shown.length} of ${data.total.toLocaleString()}, soonest deadline first`;
  $('#stats').innerHTML =
    `<span>Straight from the database in <b>${data.timings.retrieval_ms}ms</b></span>`;

  if (shown.length < data.total) {
    $('#positions').insertAdjacentHTML('beforeend',
      '<div style="padding:1.2rem 0;text-align:center">'
      + '<button class="btn" id="more">Show more</button></div>');
    $('#more').onclick = () => browse(true);
  }
}

let shown = [];

async function run(endpoint) {
  const body = payload();
  // Search with an empty box means "show me what is there". Ask with an empty box
  // means nothing at all -- there is no question to answer.
  if (!body.question) {
    if (endpoint === '/api/search') browse(false); else $('#q').focus();
    return;
  }

  for (const b of ['#ask', '#find']) $(b).disabled = true;
  $('#answer').innerHTML = '<span class="spin"></span><span class="placeholder">working…</span>';
  $('#miss').innerHTML = '';
  $('#stats').innerHTML = '';
  $('#poshead').textContent = '';
  $('#positions').innerHTML = Array.from({length: 5}, () =>
    '<div class="skel"><div style="width:72%"></div><div style="width:44%"></div></div>').join('');

  try {
    const response = await fetch(endpoint, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await response.json();

    if (data.error) {
      $('#answer').innerHTML = `<div class="err">${esc(data.error)}</div>`;
      $('#positions').innerHTML = '<div class="empty">Nothing returned.</div>';
      return;
    }

    $('#answer').innerHTML = data.answer
      ? render(data.answer, data.positions || [])
      : '<div class="placeholder">Retrieval only — no model was called.</div>';

    if (data.missing && data.missing.length) {
      $('#miss').innerHTML = `<div class="warn">The model left out
        ${data.missing.length} of ${data.given} positions it was given:
        ${data.missing.map(n => '[' + n + ']').join(', ')}. They are in the list,
        just without a comment.</div>`;
    }

    const t = data.timings || {}, u = data.usage;
    $('#stats').innerHTML = [
      `Retrieval <b>${t.retrieval_ms}ms</b>`,
      t.answer_ms ? `Model <b>${t.answer_ms}ms</b>` : '',
      u ? `Tokens <b>${u.prompt_tokens}</b> in, <b>${u.completion_tokens}</b> out` : '',
    ].filter(Boolean).map(s => `<span>${s}</span>`).join('');

    showPositions(data.positions, data.given || 0);
  } catch (error) {
    $('#answer').innerHTML = `<div class="err">${esc(error.message)}</div>`;
    $('#positions').innerHTML = '<div class="empty">Request failed.</div>';
  } finally {
    for (const b of ['#ask', '#find']) $(b).disabled = false;
  }
}

$('#ask').onclick = () => run('/api/chat');
$('#find').onclick = () => run('/api/search');
$('#q').onkeydown = e => { if (e.key === 'Enter') run('/api/chat'); };

// Populate the model dropdown from what the key can actually reach.
fetch('/api/models').then(r => r.json()).then(data => {
  const select = $('#model');
  if (data.error) { select.innerHTML = `<option>${esc(data.default)}</option>`; return; }
  select.innerHTML = data.groups.map(g =>
    `<optgroup label="${esc(g.family)}">` + g.models.map(m =>
      `<option value="${esc(m)}" ${m === data.default ? 'selected' : ''}>${esc(m)}${
        data.cheap.includes(m) ? ' (cheap)' : ''}</option>`).join('') + '</optgroup>'
  ).join('');
});

// Only countries with something open in them: an entry that can never return a
// result is worse than no entry.
fetch('/api/countries').then(r => r.json()).then(data => {
  if (data.error) return;
  $('#country').insertAdjacentHTML('beforeend', data.countries.map(c =>
    `<option value="${esc(c.code)}">${esc(c.name)} (${c.count})</option>`).join(''));
});

fetch('/api/me').then(r => r.json()).then(me => {
  if (me.error) return;
  $('#whoami').innerHTML = [
    `<span class="name">${esc(me.username)}</span>`,
    `<span title="Written answers used today, of your daily allowance">${
      me.asked_today}/${me.daily_ask_limit} asks</span>`,
    me.is_admin ? '<a href="/admin">Admin</a>' : '',
    '<a href="#" id="signout">Sign out</a>',
  ].filter(Boolean).join('');
  $('#signout').onclick = async event => {
    event.preventDefault();
    await fetch('/api/logout', {method: 'POST'});
    location.href = '/login';
  };
});

fetch('/api/stats').then(r => r.json()).then(d => {
  $('#dbstat').innerHTML = [
    ['positions', d.positions], ['open', d.open], ['expired', d.expired],
    ['countries', d.countries],
  ].map(([k, v]) => `<span class="stat"><b>${v.toLocaleString()}</b>${k}</span>`).join('');
});
</script>
</body>
</html>
