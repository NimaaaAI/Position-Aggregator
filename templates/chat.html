<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position search</title>
<style>
:root{
  --bg:#f5f7f6; --panel:#fff; --ink:#141a19; --muted:#5f6c69; --faint:#8c9793;
  --line:#dde4e1; --accent:#1a5c4c; --accent-soft:#e4efea; --warn:#8a5520;
  --danger:#93302a; --code:#eef2f0;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111716; --panel:#19201f; --ink:#e5eae8; --muted:#98a5a1; --faint:#6e7c78;
    --line:#293331; --accent:#79c2ab; --accent-soft:#1b2b27; --warn:#d69a5f;
    --danger:#dd8b84; --code:#1f2726;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:.75rem 1.2rem}
.wrap{max-width:86rem;margin:0 auto;display:flex;flex-direction:column;gap:.55rem}
.bar{display:flex;gap:.7rem;align-items:center}
.bar.opts{flex-wrap:wrap;gap:.9rem}
h1{font-size:1rem;margin:0;white-space:nowrap;font-weight:650}
h1 span{color:var(--faint);font-weight:400;font-size:.85rem}
#q{flex:1;min-width:8rem}
@media (max-width:52rem){
  .bar{flex-wrap:wrap}
  h1{width:100%}
}
input,select,button{font:inherit;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:.42rem .6rem}
input[type=number]{width:4.4rem}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.go{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button.go:disabled{opacity:.5;cursor:wait}
label{font-size:.78rem;color:var(--muted);display:flex;gap:.35rem;align-items:center}
main{max-width:86rem;margin:0 auto;padding:1.2rem;display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.2rem;align-items:start}
@media (max-width:60rem){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem}
.card h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);margin:0 0 .8rem;font-weight:600}
#answer{white-space:pre-wrap;word-wrap:break-word}
#answer .head{display:inline-block;margin-top:.9rem;color:var(--accent);
  font-size:.74rem;text-transform:uppercase;letter-spacing:.07em}
#answer .cite{color:var(--accent);text-decoration:none;font-weight:600;
  border-bottom:1px dotted var(--accent)}
#answer .cite:hover{background:var(--accent-soft)}
.stats{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted);
  border-top:1px solid var(--line);margin-top:.9rem;padding-top:.7rem;
  font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.warn{border-left:3px solid var(--warn);background:var(--code);padding:.5rem .7rem;
  border-radius:0 6px 6px 0;font-size:.83rem;margin-top:.8rem;color:var(--muted)}
.pos{border-top:1px solid var(--line);padding:.65rem 0;font-size:.85rem}
.pos:first-of-type{border-top:0}
.pos.given{background:var(--accent-soft);margin:0 -1.1rem;padding:.65rem 1.1rem;
  border-top-color:transparent}
.pos .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:.76rem}
.pos a{color:inherit;text-decoration:none;font-weight:600}
.pos a:hover{color:var(--accent);text-decoration:underline}
.pos .meta{color:var(--muted);font-size:.78rem;margin-top:.15rem}
.pos .sc{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.72rem;
  color:var(--faint);margin-top:.2rem;display:flex;gap:.75rem;flex-wrap:wrap}
.pos .sc .miss{opacity:.45}
.hint{display:inline-flex;align-items:center;justify-content:center;width:1rem;
  height:1rem;border:1px solid var(--line);border-radius:50%;font-size:.65rem;
  cursor:help;color:var(--faint)}
.tag{font-size:.68rem;border:1px solid var(--danger);color:var(--danger);
  border-radius:99px;padding:0 .4rem;margin-left:.3rem}
.empty{color:var(--faint);font-size:.86rem}
.spin{display:inline-block;width:.75rem;height:.75rem;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
  vertical-align:-.1rem;margin-right:.35rem}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <h1>Position search <span id="dbstat"></span></h1>
      <input id="q" placeholder="What are you looking for? Any language.">
      <button id="find">Search only</button>
      <button id="ask" class="go">Ask</button>
    </div>
    <div class="bar opts">
      <select id="model"></select>
      <select id="ptype" title="Applied before ranking, not after: PhD positions then compete only with other PhD positions.">
        <option value="">any kind of post</option>
        <option value="phd">PhD only</option>
        <option value="postdoc">Postdoc only</option>
        <option value="professor">Professor only</option>
        <option value="lecturer">Lecturer only</option>
        <option value="researcher">Researcher only</option>
        <option value="engineer">Engineer only</option>
      </select>
      <label>retrieve <input id="show" type="number" value="60" min="1" max="500">
        <span class="hint" title="How many the search returns and the reranker re-reads. All of them are listed on the right. Reranking costs about 25ms each, so 60 takes ~1.5s and 500 takes ~12s.">?</span>
      </label>
      <label>to model <input id="ctx" type="number" value="10" min="0" max="60"></label>
      <label><input id="openonly" type="checkbox"> open positions only</label>
      <label><input id="hybrid" type="checkbox" checked> hybrid
        <span class="hint" title="Vector search plus Postgres full-text, combined by rank fusion. Untick for vector only — try it on an acronym like MSCA or ERC Starting Grant.">?</span>
      </label>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <h2>Answer</h2>
    <div id="answer" class="empty">Ask a question, or use <b>Search only</b> to see
      retrieval work with no model and no cost.</div>
    <div id="miss"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <h2 id="poshead">Retrieved</h2>
    <div id="positions" class="empty">Nothing yet.</div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function body() {
  return {
    question: $('#q').value.trim(),
    model: $('#model').value,
    show: +$('#show').value || 60,
    context: +$('#ctx').value || 10,
    open_only: $('#openonly').checked,
    hybrid: $('#hybrid').checked,
    position_type: $('#ptype').value || null,
    rerank: true,
  };
}

// A missing score means that search did not return this position at all, which is
// worth seeing: it shows where one search found something the other missed.
function score(label, value) {
  if (value === null || value === undefined) {
    return label === 'rerank' ? '' : ` <span class="miss">${label} —</span>`;
  }
  return ` <span>${label} ${value}</span>`;
}

function showPositions(positions, given) {
  $('#poshead').textContent = given
    ? `Retrieved ${positions.length} · ${given} shown to the model`
    : `Retrieved ${positions.length}`;

  if (!positions.length) { $('#positions').innerHTML = '<div class="empty">Nothing found.</div>'; return; }

  $('#positions').innerHTML = positions.map((p, i) => `
    <div class="pos ${i < given ? 'given' : ''}">
      <span class="n">${i + 1}.</span>
      <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      ${p.closed ? '<span class="tag">closed</span>' : ''}
      <div class="meta">${esc(p.employer || '')}${p.city ? ' · ' + esc(p.city) : ''}${
        p.country ? ', ' + esc(p.country) : ''}${p.closes ? ' · closes ' + esc(p.closes) : ''}</div>
      <div class="sc">${score('rerank', p.rerank_score)}${score('vector', p.vector_score)}${
        score('chunk', p.chunk_score)}${score('text', p.text_score)}</div>
    </div>`).join('');
}

// The model writes markdown and cites positions as [3]. Turn both into HTML, and
// make each citation a link to that position — the href comes from the database
// row, never from the model, so it cannot be mistyped.
function render(text, positions) {
  let html = esc(text);

  html = html.replace(/^\s*#{1,6}\s*(.+)$/gm, '<b class="head">$1</b>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>');

  html = html.replace(/\[(\d+)\]/g, (whole, number) => {
    const position = positions[+number - 1];
    if (!position) return whole;
    return `<a class="cite" href="${esc(position.url)}" target="_blank"
             rel="noopener" title="${esc(position.title)}">[${number}]</a>`;
  });

  return html;
}

async function run(endpoint) {
  const payload = body();
  if (!payload.question) { $('#q').focus(); return; }

  for (const b of ['#ask', '#find']) $(b).disabled = true;
  $('#answer').innerHTML = '<span class="spin"></span> working…';
  $('#miss').innerHTML = '';
  $('#stats').innerHTML = '';

  try {
    const response = await fetch(endpoint, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await response.json();

    if (data.error) {
      $('#answer').innerHTML = `<span style="color:var(--danger)">${esc(data.error)}</span>`;
      return;
    }

    $('#answer').innerHTML = data.answer
      ? render(data.answer, data.positions || [])
      : '<span class="empty">Retrieval only — no model was called.</span>';

    if (data.missing && data.missing.length) {
      $('#miss').innerHTML = `<div class="warn">The model left out
        ${data.missing.length} of ${data.given} positions it was given:
        ${data.missing.map(n => '[' + n + ']').join(', ')}. They are in the list,
        just without a comment.</div>`;
    }

    const t = data.timings || {}, u = data.usage;
    $('#stats').innerHTML = [
      `retrieval <b>${t.retrieval_ms}ms</b>`,
      t.answer_ms ? `model <b>${t.answer_ms}ms</b>` : '',
      u ? `tokens <b>${u.prompt_tokens}</b> in / <b>${u.completion_tokens}</b> out` : '',
    ].filter(Boolean).map(s => `<span>${s}</span>`).join('');

    showPositions(data.positions, data.given || 0);
  } catch (error) {
    $('#answer').innerHTML = `<span style="color:var(--danger)">${esc(error.message)}</span>`;
  } finally {
    for (const b of ['#ask', '#find']) $(b).disabled = false;
  }
}

$('#ask').onclick = () => run('/api/chat');
$('#find').onclick = () => run('/api/search');
$('#q').onkeydown = e => { if (e.key === 'Enter') run('/api/chat'); };

// Populate the model dropdown from what the key can actually reach.
fetch('/api/models').then(r => r.json()).then(data => {
  const select = $('#model');
  if (data.error) { select.innerHTML = `<option>${esc(data.default)}</option>`; return; }
  select.innerHTML = data.groups.map(g =>
    `<optgroup label="${esc(g.family)}">` + g.models.map(m =>
      `<option value="${esc(m)}" ${m === data.default ? 'selected' : ''}>${esc(m)}${
        data.cheap.includes(m) ? '  (cheap)' : ''}</option>`).join('') + '</optgroup>'
  ).join('');
});

fetch('/api/stats').then(r => r.json()).then(d => {
  $('#dbstat').textContent = `· ${d.positions} positions, ${d.open} open, ${d.countries} countries`;
});
</script>
</body>
</html>
