# Sites to download. Add a block, run the script.
#
# scrape.py names no site: everything specific to one lives here. Each block says
# where the sitemap is, which of its children hold the ads, what an ad URL looks
# like, and where the ad's own id sits inside that URL.

sites:
  # https://academicpositions.com/ad/<employer>/<year>/<job-title>/<id>
  - name: academicpositions
    sitemap_index: https://academicpositions.com/sitemap.xml
    sitemap_match: jobs         # matched as plain text against the child sitemap URLs
    job_url_contains: /ad/      # so category and employer pages are skipped
    id_pattern: '/(\d+)/?$'     # the number at the end
    delay: 2

  # https://www.academictransfer.com/en/jobs/<id>/<job-title>/
  #
  # delay 10 because their robots.txt asks for it (Crawl-delay: 10). Slower than
  # the site above and deliberately so -- ~1,000 ads, so about three hours.
  - name: academictransfer
    sitemap_index: https://www.academictransfer.com/sitemap.xml
    sitemap_match: vacancies    # sitemap-vacancies.xml, next to organisations and cms
    job_url_contains: /jobs/
    id_pattern: '/jobs/(\d+)/'  # the number after /jobs/, not the slug after it
    delay: 10

  # https://www.jobs.ac.uk/job/<id>/<job-title>
  #
  # The id is letters and digits here (DQH648), not a number, which is why
  # id_pattern is a regex per site rather than a rule in the code.
  #
  # Their sitemap index names a single child, sitemap0.xml, holding both adverts
  # and ordinary pages -- job_url_contains drops the latter. Both files redirect to
  # S3; requests follows that on its own.
  - name: jobsacuk
    sitemap_index: https://www.jobs.ac.uk/sitemapindex.xml
    sitemap_match: sitemap0
    job_url_contains: /job/
    id_pattern: '/job/([A-Za-z0-9]+)'
    delay: 2

  # https://www.nature.com/naturecareers/job/<id>/<job-title>/
  #
  # Their sitemap index names ten children and only one holds adverts: sitemap1-*
  # are category and filter pages, sitemap3 and sitemap4 are employer profiles.
  # Hence sitemap_match: sitemap2 rather than something looser -- the others are
  # large and contain nothing we want.
  #
  # robots.txt blocks their search and their RSS feed, neither of which we use.
  - name: naturecareers
    sitemap_index: https://www.nature.com/naturecareers/sitemapindex.xml
    sitemap_match: sitemap2
    job_url_contains: /naturecareers/job/
    id_pattern: '/job/(\d+)'
    delay: 2
    # Their JobPosting gives the country and stops -- no addressLocality at all --
    # while the page prints "Hangzhou, Zhejiang, China" under a Location heading.
    # Without this the city is empty, and an empty city means the advert can never
    # be recognised as the same job another board is also carrying.
    fields:
      city: Location
      employer: Employer

  # https://euraxess.ec.europa.eu/jobs/<id>
  #
  # The European Commission's researcher portal, and the only one of these carrying
  # Italy, Spain and Portugal in any number -- the countries the other three barely
  # reach. About 9,200 vacancies.
  #
  # Collected differently from the rest: their sitemap lists basic pages, events and
  # news, but no vacancies at all, so the URLs come from walking the search listing.
  # listing_url + page_param select that route; the other three keep the sitemap one.
  #
  # ROBOTS: their robots.txt says "Disallow: /jobs/*" and "Disallow: /*?", which
  # covers both the adverts and the paginated listing. Downloaded anyway, by the
  # owner's decision, for one person's job search. The terms of that decision:
  # a delay of 3s -- slower than any other board here -- an honest User-Agent, no
  # attempt to defeat rate limiting, bot detection or any other control, and we stop
  # at the first sign of being blocked rather than working around it.
  # Read differently too: the only board here publishing no JobPosting JSON-LD. Its
  # facts are laid out as a <dt>/<dd> definition list instead, so `fields` says which
  # label holds which column and `body_selector` says where the advert itself sits.
  # extract.py falls back to that whenever the JSON-LD is missing.
  - name: euraxess
    listing_url: https://euraxess.ec.europa.eu/jobs/search
    page_param: page            # ?page=0, 1, 2 ... zero-indexed
    id_pattern: '/jobs/(\d+)'   # "/jobs/459098" is an ad, "/jobs/search" is not
    delay: 3
    fields:
      employer: Organisation/Company
      city: City
      country: Country
      street: Street
      postcode: Postal Code
      closes_at: Application Deadline
      industry: Research Field
    body_selector: '#offer-description ~ div.ecl'
